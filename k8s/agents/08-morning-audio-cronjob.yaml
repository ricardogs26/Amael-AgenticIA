apiVersion: batch/v1
kind: CronJob
metadata:
  name: amael-morning-audio
  namespace: amael-ia
spec:
  # Todos los días a las 6:00am hora de México
  schedule: "0 6 * * *"
  timeZone: "America/Mexico_City"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # CosyVoice3 en CPU es lento (RTF ~25); damos margen amplio para /api/chat + síntesis
      activeDeadlineSeconds: 1200
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: morning-audio
            # Imagen propia: python + ffmpeg + morning_audio.py
            # Flujo: /api/chat (resumen breve) -> CosyVoice3 /tts (WAV)
            #        -> ffmpeg WAV→OGG/opus -> bridge /send-audio (nota de voz, ptt)
            image: registry.richardx.dev/morning-audio:1.0.1
            imagePullPolicy: IfNotPresent
            env:
            - name: BOT_JWT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: amael-secrets
                  key: jwt-token
            - name: ADMIN_PHONE
              valueFrom:
                configMapKeyRef:
                  name: amael-agentic-configmap
                  key: ADMIN_PHONE
