# raphael-service — SRE Agent autónomo (extraído del backend)
#
# Fase 2.3 · feature/agents-split — ver docs/PHASE0-ANALYSIS.md
#
# Este servicio reemplaza al `k8s-agent` legacy 5.2.0 (a retirar en Fase 5) y
# promueve `agents/sre/` del backend `amael-agentic-backend` a un pod independiente.
#
# Recursos declarados en este archivo:
#   1. ConfigMap `raphael-service-config`   — env vars no-sensibles
#   2. Deployment `raphael-service`         — el pod del SRE agent
#   3. Service    `raphael-service`         — ClusterIP interno (puerto 8002)
#   4. PDB        `raphael-service-pdb`     — garantiza 1 réplica viva
#
# Dependencias externas (ya existen en el clúster):
#   - ServiceAccount `raphael-sa`           (k8s/rbac/05-raphael-rbac.yaml)
#   - NetworkPolicies con label app=raphael-service (k8s/config/03-agents-network-policies.yaml)
#   - Secret `amael-secrets` en amael-ia    (claves: ver env: del Deployment)
#
# El acceso externo NO se expone — raphael-service es puramente interno; el
# backend lo proxy-ea para el chat y el bridge de WhatsApp.

# ── ConfigMap ───────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: raphael-service-config
  namespace: amael-ia
  labels:
    app: raphael-service
    tier: agents
data:
  # ── LLM ──────────────────────────────────────────────────────────────────
  # Valores verificados contra el env real de amael-agentic-deployment (2026-04-22).
  OLLAMA_BASE_URL:  "http://ollama-service:11434"
  # A2: embeddings en el Ollama de CPU — ver k8s/infrastructure/05-ollama.yaml
  OLLAMA_EMBED_URL: "http://ollama-cpu-service:11434"
  LLM_PROVIDER:     "ollama"
  # 5-ago-2026: era qwen3:1.7b. Raphael era el ÚLTIMO consumidor del modelo
  # chico, y cada diagnóstico del loop SRE (~cada 11 min) desalojaba al
  # qwen3:14b de la VRAM — ni siquiera keep_alive=-1 lo protegía. Medido:
  # el 14b se recargaba ~6 veces/hora, y ~1 de cada 5 cargas sale en 40/41
  # capas (34% menos decode, ver LLM_MODEL_OFF_GPU).
  # El modelo chico tampoco ahorraba tiempo: diagnose_with_llm() es UNA
  # llamada directa sin pipeline, y el costo dominante era la carga:
  #     qwen3:1.7b -> 0.3 s de generación + 3.3 s de carga = ~3.6 s
  #     qwen3:14b  -> 1.6 s de generación + 0 s (ya residente) = ~1.6 s
  # Con un solo modelo grande en la GPU no hay a quién desalojar.
  LLM_MODEL:        "qwen3:14b"
  LLM_VISION_MODEL: "qwen2.5vl:3b"
  LLM_EMBED_MODEL:  "nomic-embed-text"

  # ── Tier profundo (ollama-cpu, sin GPU) ──────────────────────────────────
  # Trabajo asíncrono que no debe desalojar el modelo interactivo de la VRAM:
  #   - postmortems      → reporter.py, ~300 s después de cada ROLLOUT_RESTART
  #   - retrospectiva    → briefing.py, lunes 08:00 hora de México
  # 16.7 tok/s en CPU + 28.6 s de carga en frío (medido 5-ago-2026).
  # Borrar ambas claves revierte al comportamiento anterior sin tocar código.
  OLLAMA_DEEP_URL:  "http://ollama-cpu-service:11434"
  LLM_DEEP_MODEL:   "qwen3:30b-a3b-instruct-2507-q4_K_M"

  # ── Vigilancia de ubicación de modelos (observe_llm_placement) ───────────
  # Ollama decide si un modelo va a VRAM o CPU AL CARGARLO, y no lo revisa
  # después. Un qwen3:14b con 7% en CPU rinde 42 tok/s en vez de 64 (-34%),
  # sin síntoma visible. Y como fast_chat lo ancla con keep_alive=-1, la
  # ubicación mala se vuelve permanente.
  #
  # Lista EXPLÍCITA a propósito: la instancia ollama-cpu del tier profundo
  # corre 100% en CPU por diseño y no debe alertar nunca. Solo se consulta
  # OLLAMA_BASE_URL (la instancia con GPU).
  # Vaciar SRE_LLM_WATCH_MODELS desactiva la comprobación.
  SRE_LLM_WATCH_MODELS:  "qwen3:14b"
  SRE_LLM_GPU_MIN_RATIO: "0.99"

  # ── PostgreSQL (user/db reales: amael_user / amael_db) ──────────────────
  POSTGRES_HOST:     "postgres-service"
  POSTGRES_PORT:     "5432"
  POSTGRES_DB:       "amael_db"
  POSTGRES_USER:     "amael_user"
  POSTGRES_POOL_MIN: "2"
  POSTGRES_POOL_MAX: "10"

  # ── Redis ────────────────────────────────────────────────────────────────
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB:   "0"

  # ── Qdrant / MinIO ───────────────────────────────────────────────────────
  QDRANT_URL:     "http://qdrant-service:6333"
  MINIO_ENDPOINT: "minio-service:9000"
  MINIO_BUCKET:   "amael-uploads"
  MINIO_SECURE:   "false"

  # ── Vault ────────────────────────────────────────────────────────────────
  # VAULT_ROLE requiere crear auth/kubernetes/role/raphael-service en Vault
  # con la policy docs/vault/raphael-policy.hcl. Mientras tanto queda como
  # referencia sin efecto (raphael no llama a Vault en el path crítico).
  VAULT_ADDR: "http://vault.vault.svc.cluster.local:8200"
  VAULT_ROLE: "raphael-service"

  # ── Observabilidad ───────────────────────────────────────────────────────
  PROMETHEUS_URL:              "http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
  OTEL_SERVICE_NAME:           "raphael-service"

  # ── SRE loop (verificado contra backend real) ────────────────────────────
  SRE_NAMESPACE:               "amael-ia"
  SRE_OBSERVE_NAMESPACES:      "amael-ia,vault,observability,kong"
  SRE_PROTECTED_DEPLOYMENTS:   "postgres-deployment,ollama-deployment,vault-0"
  SRE_LOOP_ENABLED:            "true"
  SRE_LOOP_INTERVAL:           "60"
  SRE_CONFIDENCE_THRESHOLD:    "0.7"
  SRE_MAX_RESTARTS_PER_HOUR:   "3"
  SRE_CB_THRESHOLD:            "5"
  SRE_CB_RESET_SECONDS:        "300"
  SRE_VERIFICATION_DELAY:      "600"
  # Umbral de MEMORY_LEAK_PREDICTED (deriv 30m). El default de 1 MiB/s marcaba
  # crecimientos normales de github-runner/tf-serving y saturaba la GPU con
  # diagnósticos LLM continuos.
  SRE_MEMORY_LEAK_RATE_BYTES:  "5242880"
  SRE_AUTO_HEAL_MIN_SEVERITY:  "HIGH"
  SRE_MIN_ALERT_SEVERITY:      "MEDIUM"
  SRE_ALERT_PHONE:             "5219993437008"
  # agents/sre/reporter.py lee OWNER_PHONE. Sin esta clave el pod detectaba las
  # anomalías pero nunca mandaba el WhatsApp ("WhatsApp no configurado"), que es
  # lo que dejó pasar el incidente de ollama del 31-jul-2026 sin aviso.
  OWNER_PHONE:                 "5219993437008"
  WHATSAPP_BRIDGE_URL:         "http://whatsapp-bridge-service:3000"
  # Umbral de envío real (distinto de SRE_MIN_ALERT_SEVERITY, que filtra antes).
  SRE_MIN_NOTIFY_SEVERITY:     "HIGH"

  # ── Camael (GitOps) ──────────────────────────────────────────────────────
  # Camael NO se importa en este proceso: corre standalone en camael-service.
  # Con el default `inprocess` el handoff moría con AgentNotFoundError.
  CAMAEL_MODE:        "remote"
  CAMAEL_SERVICE_URL: "http://camael-service:8003"
  # Raphael consulta el proveedor SCM para decidir si un manifest descubierto
  # vía ArgoCD es parcheable por Camael o requiere intervención manual.
  # Debe coincidir con el de camael-service.
  SCM_PROVIDER:       "github"
  SCM_OWNER:          "ricardogs26"
  SCM_DEFAULT_REPO:   "Amael-AgenticIA"
  # El Lease nombre DEBE coincidir con el que usa el backend inprocess
  # (sre-agentic-leader, NO sre-agent-leader). Durante la transición solo
  # uno de los dos gana el Lease y corre el loop; tras Fase 5 el backend
  # deja de competir.
  SRE_LEASE_NAME: "sre-agentic-leader"

  # ── Runtime ──────────────────────────────────────────────────────────────
  ENVIRONMENT: "production"
  LOG_LEVEL:   "INFO"
  # Flag heredado del backend — irrelevante en raphael-service pero
  # consistente por si algún módulo compartido lo consulta.
  AGENTS_MODE: "inprocess"

---
# ── Deployment ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: raphael-service
  namespace: amael-ia
  labels:
    app: raphael-service
    tier: agents
    version: "1.0.0"
spec:
  replicas: 1    # single-node MicroK8s; HA futuro ya está soportado vía Lease
  selector:
    matchLabels:
      app: raphael-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0    # nunca bajar por debajo de 1 réplica
      maxSurge: 1
  template:
    metadata:
      labels:
        app: raphael-service
        tier: agents
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8002"
        prometheus.io/path:   "/metrics"
    spec:
      serviceAccountName: raphael-sa
      # fsGroup 1000 = usuario amael (el mismo UID que usa el backend)
      securityContext:
        fsGroup: 1000
      # Permitir que el lifespan drene: cierra SRE loop, PG pool, OTel flush.
      terminationGracePeriodSeconds: 30

      # Esperar a que PostgreSQL y Redis estén listos antes de arrancar.
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service 5432; do
                echo "Esperando PostgreSQL..."; sleep 3
              done
              echo "PostgreSQL listo."
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis-service 6379; do
                echo "Esperando Redis..."; sleep 3
              done
              echo "Redis listo."

      containers:
        - name: raphael
          image: registry.richardx.dev/raphael-service:1.1.27
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002

          # ── Env vars no-sensibles ────────────────────────────────────────
          envFrom:
            - configMapRef:
                name: raphael-service-config

          # ── Secrets ──────────────────────────────────────────────────────
          # Nombres reales en el cluster (verificado 2026-04-22):
          #   amael-secrets       → POSTGRES_PASSWORD, MINIO_ACCESS_KEY, MINIO_ROOT_PASSWORD
          #   google-auth-secret  → jwt_secret_key, session_secret_key, internal_api_secret
          # Mismo patrón que `k8s/agents/05-backend-deployment.yaml`.
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: amael-secrets
                  key: POSTGRES_PASSWORD
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: amael-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY     # settings.py espera MINIO_SECRET_KEY pero el Secret lo guarda como MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: amael-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-auth-secret
                  key: internal_api_secret
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: google-auth-secret
                  key: jwt_secret_key
            - name: SESSION_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: google-auth-secret
                  key: session_secret_key

            # Identidad del pod para Lease leader election (SRE).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

          # ── Recursos ─────────────────────────────────────────────────────
          resources:
            requests:
              cpu:    "200m"
              memory: "512Mi"
            limits:
              cpu:    "1000m"
              memory: "1Gi"

          # ── Probes ───────────────────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds:       30
            timeoutSeconds:      5
            failureThreshold:    3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds:       10
            timeoutSeconds:      3
            failureThreshold:    2

          # ── Seguridad ────────────────────────────────────────────────────
          # readOnlyRootFilesystem=false porque la app puede escribir logs
          # temporales y cachés locales durante la operación.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

---
# ── Service ─────────────────────────────────────────────────────────────────
# ClusterIP interno — el backend y el whatsapp-bridge son los únicos
# consumidores (ver NetworkPolicy en k8s/config/03-agents-network-policies.yaml).
apiVersion: v1
kind: Service
metadata:
  name: raphael-service
  namespace: amael-ia
  labels:
    app: raphael-service
    tier: agents
    monitor: amael-metrics
spec:
  type: ClusterIP
  selector:
    app: raphael-service
  ports:
    - name:       http
      protocol:   TCP
      port:       8002
      targetPort: http    # named port → más robusto ante cambios de containerPort

---
# ── PodDisruptionBudget ─────────────────────────────────────────────────────
# Garantiza que al menos 1 pod de raphael-service siga vivo durante drenajes
# de nodo o actualizaciones voluntarias. Con replicas=1 + minAvailable=1 el
# drain de un nodo fallará hasta que haya otro pod — aceptable en single-node.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: raphael-service-pdb
  namespace: amael-ia
  labels:
    app: raphael-service
    tier: agents
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: raphael-service
