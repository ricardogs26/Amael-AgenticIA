# cosyvoice-service — TTS via Fun-CosyVoice3-0.5B
# Desde 2.3.0 (7-oct-2026) corre en la GPU junto al LLM de ollama: pesos fp16
# (~1.6 GiB), tope de 3.5 GiB por proceso, CPU si no hay ≥4 GiB libres al
# arrancar o si la GPU falla en caliente. ~1 s por segundo de audio (antes ~45).
# NO pide nvidia.com/gpu (esa la tiene ollama): containerd usa el runtime nvidia
# por defecto y NVIDIA_VISIBLE_DEVICES basta. Rollback: COSYVOICE_DEVICE=cpu.
# El modelo se descarga manualmente al PVC antes del primer despliegue
# (huggingface_hub.snapshot_download('FunAudioLLM/Fun-CosyVoice3-0.5B-2512',
#  local_dir='/models/Fun-CosyVoice3-0.5B') desde cualquier pod con el PVC montado).
#
# Rollback a CosyVoice2: re-descargar FunAudioLLM/CosyVoice2-0.5B al PVC
# (dir eliminado 2026-07-09 para liberar 4.6GB) y apuntar COSYVOICE_MODEL_DIR.
# AutoModel detecta la versión por el yaml del modelo.
#
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cosyvoice-models-pvc
  namespace: amael-ia
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosyvoice-deployment
  namespace: amael-ia
  labels:
    app: cosyvoice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cosyvoice
  strategy:
    # Dos pods cargando el modelo a la vez duplicarían la VRAM junto al LLM.
    type: Recreate
  template:
    metadata:
      labels:
        app: cosyvoice
        monitor: amael-metrics
    spec:
      containers:
        - name: cosyvoice
          image: registry.richardx.dev/cosyvoice-service:2.4.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8010

          env:
            - name: COSYVOICE_MODEL_DIR
              value: "/models/Fun-CosyVoice3-0.5B"
            # LLM post-entrenado con GRPO — mejor pronunciación y similitud
            # de hablante que llm.pt (base). Quitar el env → vuelve al base.
            - name: COSYVOICE_LLM_FILE
              value: "llm.rl.pt"
            # Voz por defecto de /tts: voz clonada de Ricardo (transcripción en
            # el sidecar ricardo.wav.txt). Quitar el env → vuelve a es_MX_female.
            - name: COSYVOICE_DEFAULT_REF_WAV
              value: "/models/reference/ricardo.wav"
            - name: TTS_MAX_CHARS
              value: "500"
            # ── GPU compartida con ollama (2.3.0) ──────────────────────────
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"        # utility = nvidia-smi (medir VRAM libre)
            - name: COSYVOICE_DEVICE
              value: "auto"                   # rollback: "cpu"
            - name: COSYVOICE_MIN_FREE_GIB
              value: "4.0"                    # la carga pasa por fp32 (~3.7 GiB)
            - name: COSYVOICE_MAX_VRAM_GIB
              value: "3.5"                    # tope en operación (medido: pico 3.4)
            - name: COSYVOICE_HALF_WEIGHTS
              value: "true"
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            # wetext bajaba sus .fst de modelscope.cn en CADA arranque (~5 min):
            # la caché vive en el PVC.
            - name: MODELSCOPE_CACHE
              value: "/models/modelscope-cache"

          resources:
            requests:
              cpu: "500m"
              memory: "4Gi"
            limits:
              # Los límites se quedan: si cae a CPU (respaldo) vuelve a necesitar
              # ~4 núcleos y ~8-12 GiB de RAM.
              cpu: "4"
              memory: "14Gi"
            # Sin nvidia.com/gpu — esa la reserva ollama; la GPU se comparte vía
            # NVIDIA_VISIBLE_DEVICES (ver encabezado).

          volumeMounts:
            - name: models
              mountPath: /models

          startupProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 54   # hasta 10 min: margen si arranca en CPU o sin caché de .fst
          livenessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 5

      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: cosyvoice-models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cosyvoice-service
  namespace: amael-ia
  labels:
    app: cosyvoice
spec:
  selector:
    app: cosyvoice
  ports:
    - name: http
      port: 8010
      targetPort: 8010
  type: ClusterIP
