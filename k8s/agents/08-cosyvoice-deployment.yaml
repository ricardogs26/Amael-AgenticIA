# cosyvoice-service — TTS via Fun-CosyVoice3-0.5B (CPU only)
# El modelo se descarga manualmente al PVC antes del primer despliegue
# (huggingface_hub.snapshot_download('FunAudioLLM/Fun-CosyVoice3-0.5B-2512',
#  local_dir='/models/Fun-CosyVoice3-0.5B') desde cualquier pod con el PVC montado).
#
# Rollback a CosyVoice2: re-descargar FunAudioLLM/CosyVoice2-0.5B al PVC
# (dir eliminado 2026-07-09 para liberar 4.6GB) y apuntar COSYVOICE_MODEL_DIR.
# AutoModel detecta la versión por el yaml del modelo.
#
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cosyvoice-models-pvc
  namespace: amael-ia
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosyvoice-deployment
  namespace: amael-ia
  labels:
    app: cosyvoice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cosyvoice
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: cosyvoice
        monitor: amael-metrics
    spec:
      containers:
        - name: cosyvoice
          image: registry.richardx.dev/cosyvoice-service:2.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8010

          env:
            - name: COSYVOICE_MODEL_DIR
              value: "/models/Fun-CosyVoice3-0.5B"
            - name: TTS_MAX_CHARS
              value: "500"

          resources:
            requests:
              cpu: "2"
              memory: "6Gi"
            limits:
              cpu: "4"
              memory: "14Gi"
            # Sin nvidia.com/gpu — CPU only, la GPU queda exclusiva para Ollama
            # CosyVoice2-0.5B: llm.pt (1.9G) + tokenizers (950M) + flow (700M)
            # + PyTorch buffer overhead en CPU → necesita ~8-12GB real

          volumeMounts:
            - name: models
              mountPath: /models

          startupProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 54   # hasta 10 min: 60 + 54*10 = 600s (modelo CPU pesado + .fst downloads)
          livenessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 0
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 5

      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: cosyvoice-models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cosyvoice-service
  namespace: amael-ia
  labels:
    app: cosyvoice
spec:
  selector:
    app: cosyvoice
  ports:
    - name: http
      port: 8010
      targetPort: 8010
  type: ClusterIP
