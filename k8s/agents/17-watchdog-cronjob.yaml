# watchdog — vigilante externo de deployments críticos
#
# Origen: incidente ollama del 31-jul-2026. El nodo se reinició, dejó 5 pods de
# ollama-deployment en ContainerStatusUnknown reteniendo la GPU, y el clúster
# estuvo ~15 h sin LLM sin que nadie se enterara. Raphael lo detectó pero su
# remediación fallaba y su notificación estaba mal configurada.
#
# Este CronJob NO depende de Raphael ni de Prometheus/Alertmanager: pod propio,
# ServiceAccount propia, y una única responsabilidad — comprobar que los
# deployments críticos tienen réplicas disponibles y mandar WhatsApp si no.
#
# Código: agents/sre/watchdog.py

# ── ServiceAccount ──────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: watchdog-sa
  namespace: amael-ia
  labels:
    app: watchdog
    tier: agents

---
# ── RBAC ────────────────────────────────────────────────────────────────────
# Reutiliza el ClusterRole read-only existente (sre-agent-observer). El
# watchdog solo lee — nunca borra ni parchea nada.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: watchdog-observer
  labels:
    app: watchdog
subjects:
  - kind: ServiceAccount
    name: watchdog-sa
    namespace: amael-ia
roleRef:
  kind: ClusterRole
  name: sre-agent-observer
  apiGroup: rbac.authorization.k8s.io

---
# ── CronJob ─────────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: CronJob
metadata:
  name: amael-watchdog
  namespace: amael-ia
  labels:
    app: watchdog
    tier: agents
spec:
  schedule: "*/10 * * * *"
  timeZone: "America/Mexico_City"
  concurrencyPolicy: Forbid
  # Historial corto pero suficiente para ver el patrón de fallos en
  # `kubectl get jobs -n amael-ia`.
  successfulJobsHistoryLimit: 2
  # El watchdog sale con código != 0 A PROPÓSITO cuando detecta un deployment
  # sin réplicas: es su forma de señalar. Eso deja pods en Failed, y el estado
  # Failed de un pod de Job persiste PARA SIEMPRE — no se recupera solo.
  # El 6-ago-2026 se acumularon 4 (del incidente de red de las 09:39) y cada uno
  # generaba un POD_FAILED por hora en raphael + una falsa alerta en night-watch.
  # Con 2 basta para diagnosticar el último fallo sin dejar rastro perpetuo.
  failedJobsHistoryLimit: 2
  # Si el nodo estuvo caído, no reprocesar una avalancha de ejecuciones viejas.
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      # Recolecta el Job (y su pod) 6 h después de terminar, exitoso o no.
      ttlSecondsAfterFinished: 21600
      backoffLimit: 1
      activeDeadlineSeconds: 180
      template:
        metadata:
          labels:
            app: watchdog
        spec:
          serviceAccountName: watchdog-sa
          restartPolicy: Never
          containers:
            - name: watchdog
              image: registry.richardx.dev/raphael-service:1.1.30
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "agents.sre.watchdog"]
              env:
                - name: WATCHDOG_DEPLOYMENTS
                  value: >-
                    amael-ia/ollama-deployment,
                    amael-ia/postgres,
                    amael-ia/redis,
                    amael-ia/qdrant,
                    amael-ia/amael-agentic-deployment,
                    amael-ia/raphael-service,
                    amael-ia/whatsapp-bridge-deployment,
                    hackathon/optionwright
                # Un aviso por recurso cada 60 min — suficiente para no olvidarlo,
                # poco para no volverse ruido que se aprende a ignorar.
                - name: WATCHDOG_REALERT_MIN
                  value: "60"
                - name: OWNER_PHONE
                  value: "5219993437008"
                - name: WHATSAPP_BRIDGE_URL
                  value: "http://whatsapp-bridge-service:3000"
                # Vault sellado no se ve en ningún Deployment: el pod corre y
                # responde, pero no entrega secretos. El 7-ago-2026 llevaba 4 h
                # sellado y solo se supo porque el brief de las 7:00 dijo que
                # faltaban credenciales de Google. Vaciar para desactivar.
                - name: WATCHDOG_VAULT_ADDR
                  value: "http://vault.vault.svc.cluster.local:8200"
                # El PAT del runner también es el de Camael (PRs del flujo
                # GitOps) y el del deploy del CI. Cuando expiró el 12-ago-2026
                # se cayeron los tres a la vez y el único síntoma fue el runner
                # en CrashLoop cinco días — no lo vigilamos por réplicas porque
                # el runner efímero pasa por 0 réplicas por diseño. `optional`
                # para que el watchdog arranque aunque el Secret no exista:
                # sin token el chequeo se apaga solo.
                - name: WATCHDOG_GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: github-runner-secret
                      key: ACCESS_TOKEN
                      optional: true
                # Avisar con una semana es lo que hace la rotación barata.
                - name: WATCHDOG_GH_EXPIRY_DAYS
                  value: "7"
                - name: REDIS_HOST
                  value: "redis-service"
                - name: REDIS_PORT
                  value: "6379"
              resources:
                requests:
                  cpu: "50m"
                  memory: "128Mi"
                limits:
                  cpu: "300m"
                  memory: "256Mi"
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
