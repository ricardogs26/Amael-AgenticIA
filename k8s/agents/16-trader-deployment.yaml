# trader-service — Agente de trading experimental (Alpaca paper/live)
#
# Fase 1: TRADER_MODE=paper (dinero ficticio). Pasar a live requiere:
#   1. Cuenta brokerage real en Alpaca (KYC)
#   2. Actualizar Secret alpaca-credentials con las keys live
#   3. TRADER_MODE=live en el ConfigMap
#
# Recursos:
#   1. ConfigMap `trader-service-config` — env no-sensibles (límites del policy engine)
#   2. Deployment `trader-service`
#   3. Service    `trader-service` (ClusterIP :8003, interno)
#
# Dependencias:
#   - Secret `alpaca-credentials` (ALPACA_API_KEY, ALPACA_SECRET_KEY) — crear a mano:
#       kubectl create secret generic alpaca-credentials -n amael-ia \
#         --from-literal=ALPACA_API_KEY=<key> --from-literal=ALPACA_SECRET_KEY=<secret>
#   - Secret `amael-secrets` (POSTGRES_PASSWORD)
#   - Secret `google-auth-secret` (internal_api_secret, jwt_secret_key, session_secret_key)
#
# El acceso externo NO se expone — trader-service es interno; el frontend lo
# consumirá vía proxy del backend (fase 2).

# ── ConfigMap ───────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: trader-service-config
  namespace: amael-ia
  labels:
    app: trader-service
    tier: agents
data:
  # ── Modo — paper hasta que la fase de evaluación lo apruebe ──────────────
  TRADER_MODE: "paper"

  # ── Loop ─────────────────────────────────────────────────────────────────
  TRADER_LOOP_ENABLED:  "true"
  TRADER_LOOP_INTERVAL: "600"          # 10 min

  # ── Policy engine (límites duros — el LLM no puede saltárselos) ──────────
  # Paper corre con los $100k default de Alpaca; proporciones equivalentes al
  # experimento live de $200: 10% máx por orden, HALT al 85% del capital.
  # Al pasar a live ($200): MAX_ORDER=20, HALT=170, APPROVAL=50.
  TRADER_MAX_ORDER_USD:          "10000"
  TRADER_MAX_ORDERS_PER_DAY:     "5"
  TRADER_MAX_SYMBOL_EXPOSURE_USD: "20000"   # 2x max_order; en live con $200 → 40
  TRADER_HALT_EQUITY_USD:        "85000"
  TRADER_SYMBOL_WHITELIST:       "SPY,QQQ,VOO,BTC/USD,ETH/USD"
  TRADER_MIN_CONFIDENCE:         "0.5"
  TRADER_CB_CONSECUTIVE_LOSSES:  "3"
  TRADER_APPROVAL_THRESHOLD_USD: "50"

  # ── LLM ──────────────────────────────────────────────────────────────────
  OLLAMA_BASE_URL:  "http://ollama-service:11434"
  TRADER_LLM_MODEL: "qwen3:14b"
  LLM_PROVIDER:     "ollama"
  LLM_MODEL:        "qwen3:14b"
  LLM_EMBED_MODEL:  "nomic-embed-text"

  # ── PostgreSQL / Redis ───────────────────────────────────────────────────
  POSTGRES_HOST:     "postgres-service"
  POSTGRES_PORT:     "5432"
  POSTGRES_DB:       "amael_db"
  POSTGRES_USER:     "amael_user"
  POSTGRES_POOL_MIN: "1"
  POSTGRES_POOL_MAX: "5"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB:   "0"

  # ── WhatsApp ─────────────────────────────────────────────────────────────
  WHATSAPP_BRIDGE_URL: "http://whatsapp-bridge-service:3000"
  TRADER_ALERT_PHONE:  "5219993437008"

  # ── Observabilidad ───────────────────────────────────────────────────────
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
  OTEL_SERVICE_NAME:           "trader-service"

  # ── Runtime ──────────────────────────────────────────────────────────────
  ENVIRONMENT: "production"
  LOG_LEVEL:   "INFO"

---
# ── Deployment ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trader-service
  namespace: amael-ia
  labels:
    app: trader-service
    tier: agents
    version: "1.0.0"
spec:
  replicas: 1        # 1 réplica SIEMPRE — el loop no tiene leader election
  selector:
    matchLabels:
      app: trader-service
  strategy:
    type: Recreate   # nunca dos loops simultáneos (duplicaría órdenes)
  template:
    metadata:
      labels:
        app: trader-service
        tier: agents
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port:   "8003"
        prometheus.io/path:   "/metrics"
    spec:
      securityContext:
        fsGroup: 1000
      terminationGracePeriodSeconds: 30

      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service 5432; do
                echo "Esperando PostgreSQL..."; sleep 3
              done
              echo "PostgreSQL listo."
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis-service 6379; do
                echo "Esperando Redis..."; sleep 3
              done
              echo "Redis listo."

      containers:
        - name: trader
          image: registry.richardx.dev/trader-service:1.0.7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8003

          envFrom:
            - configMapRef:
                name: trader-service-config

          env:
            - name: ALPACA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: alpaca-credentials
                  key: ALPACA_API_KEY
            - name: ALPACA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: alpaca-credentials
                  key: ALPACA_SECRET_KEY
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: amael-secrets
                  key: POSTGRES_PASSWORD
            # MINIO_* solo porque config.settings los exige como campos requeridos
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: amael-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: amael-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-auth-secret
                  key: internal_api_secret
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: google-auth-secret
                  key: jwt_secret_key
            - name: SESSION_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: google-auth-secret
                  key: session_secret_key

          resources:
            requests:
              cpu:    "100m"
              memory: "128Mi"
            limits:
              cpu:    "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds:       30
            timeoutSeconds:      5
            failureThreshold:    3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds:       10
            timeoutSeconds:      3
            failureThreshold:    2

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

---
# ── Service ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: trader-service
  namespace: amael-ia
  labels:
    app: trader-service
    tier: agents
    monitor: amael-metrics
spec:
  type: ClusterIP
  selector:
    app: trader-service
  ports:
    - name:       http
      protocol:   TCP
      port:       8003
      targetPort: http
