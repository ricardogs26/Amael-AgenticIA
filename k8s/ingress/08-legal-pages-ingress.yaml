# Páginas legales que Google exige para publicar la app OAuth de Amael
# (scopes sensibles: calendar + gmail.readonly). Sin estas URLs la consola
# de GCP no deja pasar de «Testing» y el refresh token caduca a los 7 días.
# Servidas por el mismo nginx de /poc; el HTML vive en docs/legal/ y entra al
# ConfigMap poc-presentation-html (ver README de POC para el comando).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: amael-legal-ingress
  namespace: amael-ia
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1.html
spec:
  ingressClassName: public
  rules:
  - host: amael-ia.richardx.dev
    http:
      paths:
      - path: /(privacy|terms)$
        pathType: ImplementationSpecific
        backend:
          service:
            name: poc-presentation-service
            port:
              number: 80
  tls:
  - hosts:
    - amael-ia.richardx.dev
    secretName: amael-ia-tls-secret
