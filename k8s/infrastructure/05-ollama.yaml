# ── Ollama — inferencia LLM local con GPU ─────────────────────────────────────
# Modelos en uso (pull manual después del primer despliegue):
#   ollama pull qwen3:14b           # LLM de análisis (tier 2)
#   ollama pull qwen3:1.7b          # Ruta rápida / triador (tier 1)
#   ollama pull nomic-embed-text    # Embeddings RAG + runbooks (768 dims)
#
# GPU: nvidia.com/gpu: 1 — asignada exclusivamente a este pod
# ⚠️  IMPORTANTE: Usar strategy: Recreate o kubectl delete pod (NO rollout restart)
#     Con RollingUpdate el pod nuevo queda Pending esperando la GPU única
#
# Restart correcto:
#   kubectl delete pod -l app=ollama -n amael-ia
#
# ── Historial ────────────────────────────────────────────────────────────────
# 5-ago-2026 — Reconciliación de drift + tuning de concurrencia.
#
#   Este archivo estuvo DESINCRONIZADO del cluster desde la migración de
#   Amael-IA/: pedía `ollama/ollama:0.4.6` mientras corría `ollama/ollama`
#   (latest, resuelto a 0.32.5), con cpu 2 / 14Gi y SIN ninguna env var.
#   El manifest realmente aplicado se perdió al retirar Amael-IA/k8s/.
#   Aplicarlo tal cual habría degradado a 0.4.6 (nov-2024), que no soporta qwen3.
#
#   Baseline medido antes del cambio: docs/benchmarks/ollama-baseline-2026-08-05.md
#     qwen3:14b — 63.0 tok/s decode · 2,530 tok/s prefill · 9.6 GB VRAM
#     Concurrencia: 1 solo slot → las peticiones se serializaban en cola.
#
#   Cambios aplicados:
#     - imagen fijada a 0.32.5 (era un tag mutable: un restart podía cambiar
#       la versión en caliente e invalidar cualquier comparación A/B)
#     - strategy: Recreate (el live estaba en RollingUpdate — la trampa de la
#       GPU única documentada arriba)
#     - NUM_PARALLEL=2 → techo de concurrencia 44 → 75-82 tok/s agregados
#     - FLASH_ATTENTION=1
#
#   Lo que NO se pudo aplicar: subir CONTEXT_LENGTH.
#     El plan era 8192, pero solo cabe con el KV cuantizado a q8_0 — y esa
#     variable rompe los embeddings (ver ⛔ abajo). Con KV en f16 el segundo
#     slot de NUM_PARALLEL ya consume los ~1.9 GB libres que había, así que
#     el contexto se queda en 4096. Subirlo exige liberar VRAM primero.
#
#   Coste conocido de NUM_PARALLEL=2: el KV del 14b se duplica (2 slots ×
#   4096 × 160 KiB = 1.25 GiB), el modelo pasa de 9.6 a 10 GB y quedan
#   ~960 MiB — insuficientes para nomic-embed-text completo, que queda al
#   74% CPU / 26% GPU. Embeddings en batch de 32: 199 → 66 chunks/s.
#   En batch de 1 (la ruta de consulta RAG) el impacto es de +5 ms.
#
#   OLLAMA_KEEP_ALIVE=24h (añadido más tarde el 5-ago-2026).
#   Al principio se dejó fuera a propósito, porque qwen3:14b (10 GB) +
#   qwen3:1.7b (2.2 GB) + nomic-embed (0.4 GB) no caben en 11.5 GiB y anclar
#   habría provocado thrashing. Esa premisa dejó de ser cierta al retirar el
#   modelo chico: raphael era su último consumidor y pasó a qwen3:14b.
#   Ahora solo quedan 14b (10 GB) + nomic (0.4 GB) = 10.4 GB — sí caben, y
#   anclarlos elimina las ~6 recargas/hora que exponían al modelo a la
#   condición de frontera descrita abajo.
#
#   CONDICION DE FRONTERA (causa raíz de LLM_MODEL_OFF_GPU):
#   Ollama calcula available = free - minimum(457 MiB). Medido: available
#   oscila entre 10.2 y 10.4 GiB, y qwen3:14b con NUM_PARALLEL=2 necesita
#   ~10.2 GiB (8.64 pesos + 1.25 KV + 0.35 buffers). Está JUSTO en el límite:
#   de 48 cargas observadas, 39 dieron 41/41 capas y 9 dieron 40/41 — y esa
#   única capa en CPU cuesta un 34% del decode (42 vs 64 tok/s).
#   RESUELTO volviendo a NUM_PARALLEL=1: el KV baja a 0.63 GiB, el modelo pide
#   ~9.6 GiB y el margen sube a ~1.4 GiB. Además libera VRAM suficiente para que
#   nomic-embed-text entre en GPU (con NUM_PARALLEL=2 quedaba anclado en CPU:
#   embeddings de 29 ms a 334 ms, y de 176 ms a 10.9 s en batch de 32).
#
#   Se perdió el techo de concurrencia (75-82 -> 44 tok/s agregados). Decisión
#   tomada con datos de 7 días de Prometheus, no por intuición:
#     - 2142 invocaciones LLM en 7 días = 12.8/hora, una cada 4.7 min
#     - el 99.9% son automáticas: raphael (1298) y trader (841). El pipeline de
#       chat humano se invocó 3 veces en toda la semana.
#     - solapes reales: 1-7% de las llamadas según su duración (3-20 al día)
#     - encolarlas cuesta ~19 s/día, y siempre en trabajo asíncrono que nadie espera
#   Frente a eso, un aterrizaje en 40/41 degrada un 34% TODAS las llamadas del
#   día. Revisar esta decisión si amael_executor_step_latency_seconds_count
#   (chat humano) crece de forma sostenida.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
  namespace: amael-ia
  labels:
    app: ollama
    app.kubernetes.io/part-of: amael-ia
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi   # qwen2.5:14b ~9GB + nomic-embed-text ~274MB + qwen2.5-vl:7b ~5GB

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-deployment
  namespace: amael-ia
  labels:
    app: ollama
    app.kubernetes.io/part-of: amael-ia
spec:
  replicas: 1
  strategy:
    type: Recreate   # GPU única — no puede haber dos pods simultáneos
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:0.32.5   # NUNCA usar tag mutable — ver Historial
        ports:
        - containerPort: 11434
        resources:
          requests:
            cpu: "500m"
            memory: "4Gi"
            nvidia.com/gpu: 1
          limits:
            cpu: "4000m"
            memory: "16Gi"
            nvidia.com/gpu: 1
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0"
        - name: OLLAMA_NUM_PARALLEL
          value: "1"        # Estuvo en 2 unas horas el 5-ago-2026 y se revirtió:
                            # duplicaba el KV (+0.6 GiB) y dejaba al qwen3:14b
                            # justo en el límite de VRAM. Ver Historial.
        - name: OLLAMA_CONTEXT_LENGTH
          value: "8192"     # A2 (7-ago-2026): posible gracias a KV q8_0.
                            # Con f16 el tope era 4096 y el prompt del trader
                            # (4.3k tokens tras 1.0.30/31) se truncaba POR EL
                            # FRENTE: el system prompt moría y el LLM contestaba
                            # {"error": "entrada no válida"} → holds conf=0.
                            # OJO: el contexto EFECTIVO es del runner cargado —
                            # ningún cliente debe mandar num_ctx propio o cada
                            # alternancia recarga el modelo (~10-20 s).
        # A2 — FLASH_ATTENTION y KV q8_0 son seguros AQUÍ desde que los
        # embeddings viven en ollama-cpu (OLLAMA_EMBED_URL en los consumidores).
        # El ⛔ histórico de abajo era correcto para el servidor mixto: ambas
        # variables son GLOBALES y a nomic-embed-text (arch nomic-bert) lo
        # tiraban a -ngl 0 → embeddings de 29 ms a 3,100 ms. Ese modelo ya no
        # se sirve desde aquí, así que la mina desapareció CON los embeddings.
        # Si algún día un embedder vuelve a este servidor, estas dos variables
        # deben salir primero.
        - name: OLLAMA_FLASH_ATTENTION
          value: "1"        # prerequisito de KV cuantizada; suele mejorar decode
        - name: OLLAMA_KV_CACHE_TYPE
          value: "q8_0"     # KV a mitad de VRAM: 8192 tokens ≈ 0.65 GB vs 1.3
                            # en f16. Pérdida de calidad ~nula (es la caché de
                            # atención, no los pesos).
        - name: OLLAMA_KEEP_ALIVE
          value: "24h"      # ver Historial: solo es seguro desde
                            # que se retiró qwen3:1.7b. Evita ~6 recargas/hora.
        # (Histórico 5-ago: KV q8_0 estaba vetado porque este servidor
        #  también hospedaba nomic-embed-text — ver la nota A2 arriba.)
        # A2: el calentamiento del embedder se fue con él a ollama-cpu. El
        # postStart que corría aquí la carrera nomic-vs-14b ya no tiene objeto
        # (y de hecho la carrera se perdía tras cada reinicio de containerd:
        # el 7-ago nomic amaneció en CPU pese al postStart).
        lifecycle:
          postStart:
            exec:
              command:
              - /usr/bin/sh
              - -c
              - |
                i=0
                while [ $i -lt 90 ]; do
                  ollama list >/dev/null 2>&1 && break
                  i=$((i+1)); sleep 2
                done
                ollama run qwen3:14b "" >/dev/null 2>&1 || true
        volumeMounts:
        - name: ollama-storage
          mountPath: /root/.ollama
        livenessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
      volumes:
      - name: ollama-storage
        persistentVolumeClaim:
          claimName: ollama-pvc
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: amael-ia
  labels:
    app: ollama
spec:
  selector:
    app: ollama
  ports:
  - protocol: TCP
    port: 11434
    targetPort: 11434
  type: ClusterIP
