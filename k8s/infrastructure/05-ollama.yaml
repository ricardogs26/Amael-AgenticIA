# ── Ollama — inferencia LLM local con GPU ─────────────────────────────────────
# Modelos en uso (pull manual después del primer despliegue):
#   ollama pull qwen3:14b           # LLM de análisis (tier 2)
#   ollama pull qwen3:1.7b          # Ruta rápida / triador (tier 1)
#   ollama pull nomic-embed-text    # Embeddings RAG + runbooks (768 dims)
#
# GPU: nvidia.com/gpu: 1 — asignada exclusivamente a este pod
# ⚠️  IMPORTANTE: Usar strategy: Recreate o kubectl delete pod (NO rollout restart)
#     Con RollingUpdate el pod nuevo queda Pending esperando la GPU única
#
# Restart correcto:
#   kubectl delete pod -l app=ollama -n amael-ia
#
# ── Historial ────────────────────────────────────────────────────────────────
# 5-ago-2026 — Reconciliación de drift + tuning de concurrencia.
#
#   Este archivo estuvo DESINCRONIZADO del cluster desde la migración de
#   Amael-IA/: pedía `ollama/ollama:0.4.6` mientras corría `ollama/ollama`
#   (latest, resuelto a 0.32.5), con cpu 2 / 14Gi y SIN ninguna env var.
#   El manifest realmente aplicado se perdió al retirar Amael-IA/k8s/.
#   Aplicarlo tal cual habría degradado a 0.4.6 (nov-2024), que no soporta qwen3.
#
#   Baseline medido antes del cambio: docs/benchmarks/ollama-baseline-2026-08-05.md
#     qwen3:14b — 63.0 tok/s decode · 2,530 tok/s prefill · 9.6 GB VRAM
#     Concurrencia: 1 solo slot → las peticiones se serializaban en cola.
#
#   Cambios aplicados:
#     - imagen fijada a 0.32.5 (era un tag mutable: un restart podía cambiar
#       la versión en caliente e invalidar cualquier comparación A/B)
#     - strategy: Recreate (el live estaba en RollingUpdate — la trampa de la
#       GPU única documentada arriba)
#     - NUM_PARALLEL=2 → techo de concurrencia 44 → 75-82 tok/s agregados
#     - FLASH_ATTENTION=1
#
#   Lo que NO se pudo aplicar: subir CONTEXT_LENGTH.
#     El plan era 8192, pero solo cabe con el KV cuantizado a q8_0 — y esa
#     variable rompe los embeddings (ver ⛔ abajo). Con KV en f16 el segundo
#     slot de NUM_PARALLEL ya consume los ~1.9 GB libres que había, así que
#     el contexto se queda en 4096. Subirlo exige liberar VRAM primero.
#
#   Coste conocido de NUM_PARALLEL=2: el KV del 14b se duplica (2 slots ×
#   4096 × 160 KiB = 1.25 GiB), el modelo pasa de 9.6 a 10 GB y quedan
#   ~960 MiB — insuficientes para nomic-embed-text completo, que queda al
#   74% CPU / 26% GPU. Embeddings en batch de 32: 199 → 66 chunks/s.
#   En batch de 1 (la ruta de consulta RAG) el impacto es de +5 ms.
#
#   OLLAMA_KEEP_ALIVE=24h (añadido más tarde el 5-ago-2026).
#   Al principio se dejó fuera a propósito, porque qwen3:14b (10 GB) +
#   qwen3:1.7b (2.2 GB) + nomic-embed (0.4 GB) no caben en 11.5 GiB y anclar
#   habría provocado thrashing. Esa premisa dejó de ser cierta al retirar el
#   modelo chico: raphael era su último consumidor y pasó a qwen3:14b.
#   Ahora solo quedan 14b (10 GB) + nomic (0.4 GB) = 10.4 GB — sí caben, y
#   anclarlos elimina las ~6 recargas/hora que exponían al modelo a la
#   condición de frontera descrita abajo.
#
#   CONDICION DE FRONTERA (causa raíz de LLM_MODEL_OFF_GPU):
#   Ollama calcula available = free - minimum(457 MiB). Medido: available
#   oscila entre 10.2 y 10.4 GiB, y qwen3:14b con NUM_PARALLEL=2 necesita
#   ~10.2 GiB (8.64 pesos + 1.25 KV + 0.35 buffers). Está JUSTO en el límite:
#   de 48 cargas observadas, 39 dieron 41/41 capas y 9 dieron 40/41 — y esa
#   única capa en CPU cuesta un 34% del decode (42 vs 64 tok/s).
#   Con NUM_PARALLEL=1 el KV baja a 0.63 GiB y el margen sería de 0.6-0.8 GiB,
#   pero se perdería el techo de concurrencia (75-82 -> 44 tok/s).
#   La mitigación elegida es reducir las cargas a ~una por reinicio y vigilar
#   el resultado con la anomalía LLM_MODEL_OFF_GPU de raphael.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
  namespace: amael-ia
  labels:
    app: ollama
    app.kubernetes.io/part-of: amael-ia
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi   # qwen2.5:14b ~9GB + nomic-embed-text ~274MB + qwen2.5-vl:7b ~5GB

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-deployment
  namespace: amael-ia
  labels:
    app: ollama
    app.kubernetes.io/part-of: amael-ia
spec:
  replicas: 1
  strategy:
    type: Recreate   # GPU única — no puede haber dos pods simultáneos
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:0.32.5   # NUNCA usar tag mutable — ver Historial
        ports:
        - containerPort: 11434
        resources:
          requests:
            cpu: "500m"
            memory: "4Gi"
            nvidia.com/gpu: 1
          limits:
            cpu: "4000m"
            memory: "16Gi"
            nvidia.com/gpu: 1
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0"
        - name: OLLAMA_NUM_PARALLEL
          value: "2"        # 1 = las peticiones se encolan (baseline 5-ago-2026)
        - name: OLLAMA_CONTEXT_LENGTH
          value: "4096"     # = el default. Explícito para que quede claro que
                            # es una restricción de VRAM, no un descuido.
        - name: OLLAMA_FLASH_ATTENTION
          value: "1"
        - name: OLLAMA_KEEP_ALIVE
          value: "24h"      # ver Historial: solo es seguro desde
                            # que se retiró qwen3:1.7b. Evita ~6 recargas/hora.
        # ⛔ NO activar OLLAMA_KV_CACHE_TYPE=q8_0
        #    Es un ajuste GLOBAL: Ollama pasa --cache-type-k/v a TODOS los
        #    modelos, incluido nomic-embed-text (arch nomic-bert, atención no
        #    causal, sin KV cache). El servidor lo arranca con -ngl 0 → 100% CPU
        #    y los embeddings caen de ~29 ms a ~3,100 ms por batch.
        #    Con KV en f16 (160 KiB/token en qwen3:14b) el presupuesto de VRAM
        #    solo alcanza para 4096 × 2 slots dejando sitio al embedder.
        volumeMounts:
        - name: ollama-storage
          mountPath: /root/.ollama
        livenessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
      volumes:
      - name: ollama-storage
        persistentVolumeClaim:
          claimName: ollama-pvc
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: amael-ia
  labels:
    app: ollama
spec:
  selector:
    app: ollama
  ports:
  - protocol: TCP
    port: 11434
    targetPort: 11434
  type: ClusterIP
