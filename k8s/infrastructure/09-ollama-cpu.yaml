# ── Ollama CPU — embeddings, sin GPU ─────────────────────────────────────────
# Creado 5-ago-2026 (plan "C" del análisis de VRAM) como tier profundo con
# qwen3:30b-a3b en CPU. Ese uso se retiró el 9-nov-2026 (D40 a): el modelo
# cargaba 18 GiB en RAM cada lunes 08:00 y llevó el nodo al 95 %. El tier
# profundo de Raphael y Camael ahora cae al alias de Gemma en la GPU, y el
# 30b se borró del PVC.
#
# Hoy solo sirve nomic-embed-text (274 MB): embeddings del backend y de Raphael
# (OLLAMA_EMBED_URL).
# Pico medido sin el 30b: 665 MiB de working set y 2.5 cores (7 días al 9-nov).
#
# ⚠️  NO pedir nvidia.com/gpu. El device plugin no inyecta /dev/nvidia* en pods
#     que no soliciten el recurso, pero CUDA_VISIBLE_DEVICES="" lo hace explícito.
#
# ⚠️  PVC propio a propósito: dos instancias de Ollama escribiendo el mismo
#     directorio de modelos corrompen los blobs.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-cpu-pvc
  namespace: amael-ia
  labels:
    app: ollama-cpu
    app.kubernetes.io/part-of: amael-ia
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 25Gi   # dimensionado para el 30b (retirado); hostpath no permite encoger el PVC

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-cpu-deployment
  namespace: amael-ia
  labels:
    app: ollama-cpu
    app.kubernetes.io/part-of: amael-ia
spec:
  replicas: 1
  strategy:
    type: Recreate   # PVC RWO — no puede haber dos pods montándolo a la vez
  selector:
    matchLabels:
      app: ollama-cpu
  template:
    metadata:
      labels:
        app: ollama-cpu
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:0.32.5   # misma versión que la instancia GPU
        ports:
        - containerPort: 11434
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "10"      # embeddings por lotes escalan con cores (pico 2.5)
            memory: "4Gi"  # nomic-embed-text: pico 665 MiB; margen para lotes grandes
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0"
        - name: CUDA_VISIBLE_DEVICES
          value: ""         # explícito: esta instancia NUNCA toca la GPU
        - name: OLLAMA_NUM_PARALLEL
          value: "1"        # en CPU los slots paralelos solo reparten el mismo
                            # ancho de banda de RAM; no hay nada que ganar
        - name: OLLAMA_CONTEXT_LENGTH
          value: "8192"     # el KV vive en RAM, no compite por VRAM
        volumeMounts:
        - name: ollama-cpu-storage
          mountPath: /root/.ollama
        livenessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 5
      volumes:
      - name: ollama-cpu-storage
        persistentVolumeClaim:
          claimName: ollama-cpu-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: ollama-cpu-service
  namespace: amael-ia
  labels:
    app: ollama-cpu
spec:
  selector:
    app: ollama-cpu
  ports:
  - protocol: TCP
    port: 11434
    targetPort: 11434
  type: ClusterIP
